<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Capture Studio · Demo</title>
  <meta name="description" content="Bekijk hoe AI Capture Studio inkomende mail en documenten automatisch verwerkt, of klik zelf door de app.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Questrial&display=swap">
  <style>
/* =====================================================================
   AI Capture Studio – interactieve productdemo
   Alles is gescoped onder .acs zodat het veilig in elke site past.
   ===================================================================== */

.acs {
  --acs-ink: #16202c;
  --acs-muted: #5b6677;
  --acs-track: rgba(22, 32, 44, .14);
  --acs-surface: #ffffff;
  --acs-border: rgba(22, 32, 44, .12);
  --acs-navy: #163d6b;
  --acs-magenta: #a3136c;
  --acs-grad: linear-gradient(100deg, #163d6b 0%, #2c3f78 42%, #6a2a78 72%, #a3136c 100%);
  --acs-radius: 14px;
  position: relative;
  width: 100%;
  color: var(--acs-ink);
  font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  box-sizing: border-box;
}
.acs *, .acs *::before, .acs *::after { box-sizing: border-box; }

@media (prefers-color-scheme: dark) {
  .acs:not([data-theme="light"]) {
    --acs-ink: #e8edf4;
    --acs-muted: #9aa6b8;
    --acs-track: rgba(232, 237, 244, .16);
    --acs-surface: #151b26;
    --acs-border: rgba(232, 237, 244, .14);
  }
}
.acs[data-theme="dark"] {
  --acs-ink: #e8edf4;
  --acs-muted: #9aa6b8;
  --acs-track: rgba(232, 237, 244, .16);
  --acs-surface: #151b26;
  --acs-border: rgba(232, 237, 244, .14);
}

/* Bescherming tegen stijlen van de website waarin de demo staat */
.acs :where(h1, h2, h3, h4, h5, h6, p) { font-family: inherit; font-weight: inherit; font-size: inherit; line-height: inherit; letter-spacing: normal; text-transform: none; color: inherit; margin: 0; }
.acs :where(button, input, textarea) { font: inherit; letter-spacing: normal; text-transform: none; }
.acs :where(img) { max-width: none; height: auto; }
.acs :where(table) { border-collapse: collapse; }

/* ---------- speler ---------- */
.acs .acs-screen { position: relative; }
.acs .acs-viewport {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  border-radius: var(--acs-radius);
  background: #0e1a2b;
  box-shadow: 0 24px 60px -24px rgba(10, 20, 40, .55), 0 0 0 1px rgba(0, 0, 0, .06);
  isolation: isolate;
}
.acs .acs-stage {
  position: absolute;
  left: 0; top: 0;
  width: 1440px; height: 810px;
  transform-origin: 0 0;
  overflow: hidden;
  background: #f3f4f6;
  font-size: 13px;
  line-height: 1.4;
  color: #1f2328;
  user-select: none;
  -webkit-user-select: none;
}
.acs.is-try .acs-stage { user-select: text; -webkit-user-select: text; }

/* klik-schild tijdens de rondleiding: voorkomt dat bezoekers per ongeluk de app bedienen */
.acs .acs-shield { position: absolute; inset: 0; z-index: 90; cursor: pointer; }
.acs.is-try .acs-shield, .acs.is-ended .acs-shield { display: none; }

/* ---------- ondertiteling ---------- */
.acs .acs-capclip {
  position: absolute; left: 0; right: 0; bottom: 0; height: 60%;
  overflow: hidden; pointer-events: none; z-index: 5;
  border-radius: 0 0 var(--acs-radius) var(--acs-radius);
}
.acs.is-narrow .acs-capclip { position: static; height: auto; overflow: visible; border-radius: 0; }
.acs .acs-caption {
  position: absolute;
  left: 50%; bottom: 0;
  width: min(80%, 1120px);
  transform: translate(-50%, 102%);
  padding: .8em 1.6em .95em;
  border-radius: 18px 18px 0 0;
  background:
    radial-gradient(120% 140% at 0% 0%, rgba(0, 0, 0, .55) 0%, rgba(0, 0, 0, 0) 38%),
    var(--acs-grad);
  color: #fff;
  font-family: "Questrial", "Century Gothic", "Segoe UI", sans-serif;
  font-size: var(--acs-cap-size, 22px);
  line-height: 1.28;
  text-align: center;
  text-shadow: 0 1px 2px rgba(0, 0, 0, .35);
  z-index: 5;
  transition: transform .45s cubic-bezier(.2, .8, .2, 1);
  pointer-events: none;
}
.acs .acs-caption.is-on { transform: translate(-50%, 0); }
.acs .acs-caption-text { display: block; transition: opacity .25s ease; }
.acs .acs-caption-text.is-swap { opacity: 0; }
.acs.is-try .acs-caption { transform: translate(-50%, 102%); }

.acs.is-narrow .acs-caption {
  position: static;
  width: 100%;
  transform: none;
  margin-top: 8px;
  border-radius: 12px;
  min-height: 3.9em;
  display: flex; align-items: center; justify-content: center;
  opacity: .35;
  transition: opacity .3s ease;
}
.acs.is-narrow .acs-caption.is-on { opacity: 1; }
.acs.is-narrow.is-try .acs-caption { display: none; }

/* pauze-indicator */
.acs .acs-bigplay {
  position: absolute; left: 50%; top: 50%;
  width: 84px; height: 84px; margin: -42px 0 0 -42px;
  border-radius: 50%; border: 0;
  background: rgba(14, 26, 43, .72);
  color: #fff; display: grid; place-items: center;
  z-index: 6; cursor: pointer;
  opacity: 0; transform: scale(.85); pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
  backdrop-filter: blur(4px);
}
.acs .acs-bigplay svg { width: 34px; height: 34px; margin-left: 4px; }
.acs.is-paused:not(.is-try):not(.is-ended) .acs-bigplay { opacity: 1; transform: scale(1); pointer-events: auto; }
.acs.is-idle .acs-bigplay { top: 80%; background: linear-gradient(100deg, #163d6b, #a3136c); }

/* banner in "zelf proberen"-modus */
.acs .acs-tryhint {
  position: absolute; left: 50%; bottom: 12px; z-index: 7;
  transform: translate(-50%, 160%);
  display: flex; align-items: center; gap: 10px;
  padding: 7px 8px 7px 14px;
  border-radius: 999px;
  background: rgba(14, 26, 43, .9);
  color: #fff; font-size: 13px; white-space: nowrap;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .25);
  transition: transform .35s cubic-bezier(.2, .8, .2, 1);
}
.acs .acs-tryhint button {
  border: 0; border-radius: 999px; padding: 5px 12px;
  background: #fff; color: #16202c; font: inherit; font-weight: 600; cursor: pointer;
}
.acs.is-try .acs-tryhint { transform: translate(-50%, 0); }
.acs.is-narrow .acs-tryhint { font-size: 11px; bottom: 6px; }
.acs.is-narrow .acs-tryhint > span { display: none; }

/* ---------- bedieningsbalk ---------- */
.acs .acs-controls {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 2px 0;
}
.acs .acs-btn {
  appearance: none; border: 1px solid var(--acs-border);
  background: var(--acs-surface); color: var(--acs-ink);
  height: 38px; min-width: 38px; padding: 0 12px;
  border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  cursor: pointer; white-space: nowrap;
  transition: transform .15s ease, background .15s ease, border-color .15s ease;
}
.acs .acs-btn:hover { border-color: var(--acs-muted); }
.acs .acs-btn:active { transform: scale(.96); }
.acs .acs-btn:focus-visible, .acs .acs-ch:focus-visible { outline: 2px solid #3b82c4; outline-offset: 2px; }
.acs .acs-btn svg { width: 18px; height: 18px; flex: none; }
.acs .acs-btn.is-icon { padding: 0; width: 38px; }
.acs .acs-btn.is-play { background: var(--acs-grad); color: #fff; border: 0; width: 42px; height: 42px; }
.acs .acs-btn.is-play svg { width: 20px; height: 20px; }
.acs .acs-btn.is-active { background: var(--acs-ink); color: var(--acs-surface); border-color: var(--acs-ink); }

.acs .acs-chapters { flex: 1; display: flex; gap: 4px; min-width: 0; }
.acs .acs-ch {
  appearance: none; border: 0; background: none; padding: 8px 0 0; margin: 0;
  flex: var(--w, 1) 1 0; min-width: 0; cursor: pointer; text-align: left;
  color: var(--acs-muted); font: inherit; font-size: 11.5px;
}
.acs .acs-ch-bar { display: block; height: 5px; border-radius: 3px; background: var(--acs-track); overflow: hidden; }
.acs .acs-ch-fill { display: block; height: 100%; width: 0; background: var(--acs-grad); background-size: 400px 100%; border-radius: 3px; }
.acs .acs-ch-label { display: block; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acs .acs-ch.is-current { color: var(--acs-ink); font-weight: 600; }
.acs .acs-ch:hover { color: var(--acs-ink); }
.acs .acs-now { display: none; font-size: 12px; color: var(--acs-muted); }

.acs.is-compact .acs-ch-label { display: none; }
.acs.is-compact .acs-ch { padding: 14px 0 12px; }
.acs.is-compact .acs-btn .acs-lbl { display: none; }
.acs.is-compact .acs-btn.is-try-btn { padding: 0; width: 38px; }
.acs.is-compact .acs-controls { gap: 8px; flex-wrap: wrap; }
.acs.is-compact .acs-now { display: block; width: 100%; order: 5; margin-top: -4px; }

.acs:fullscreen, .acs:-webkit-full-screen {
  background: #0b111a; color-scheme: dark;
  --acs-ink: #e8edf4; --acs-muted: #9aa6b8; --acs-track: rgba(232, 237, 244, .16);
  --acs-surface: #151b26; --acs-border: rgba(232, 237, 244, .14);
  display: flex; flex-direction: column; justify-content: center; padding: 16px 24px;
}
.acs:fullscreen .acs-screen, .acs:-webkit-full-screen .acs-screen { margin: 0 auto; }

@media (prefers-reduced-motion: reduce) {
  .acs .acs-caption, .acs .acs-caption-text, .acs .acs-tryhint, .acs .acs-bigplay { transition: none; }
}

/* =====================================================================
   Scènes: intro, procesdiagram, outro
   ===================================================================== */
.acs .acs-scene { position: absolute; inset: 0; opacity: 0; visibility: hidden; }
.acs .acs-scene.is-shown { visibility: visible; }

.acs .acs-intro { background: #fff; display: grid; place-items: center; }
.acs .acs-intro-logo { position: absolute; left: 50%; top: 50%; width: 420px; transform: translate(-50%, -50%); }
.acs .acs-intro-title {
  position: absolute; left: 0; right: 0; top: 440px; text-align: center; opacity: 0;
  font-family: "Questrial", "Century Gothic", "Segoe UI", sans-serif; color: #163d6b;
}
.acs .acs-intro-title h2 { margin: 0; font-size: 58px; font-weight: 400; letter-spacing: .5px; }
.acs .acs-intro-title p { margin: 14px 0 0; font-size: 25px; color: #3a5a82; }

.acs .acs-diagram { background: radial-gradient(120% 90% at 50% 40%, #eef4f7 0%, #e3edf2 100%); }
.acs .acs-diagram svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.acs .acs-diagram .dg-icon, .acs .acs-diagram .dg-step, .acs .acs-diagram .dg-hub, .acs .acs-diagram .dg-out { opacity: 0; }
.acs .acs-diagram .dg-line { fill: none; stroke-width: 2.2; stroke-linecap: round; }
.acs .acs-diagram text { font-family: "Questrial", "Century Gothic", "Segoe UI", sans-serif; }
.acs .acs-diagram .dg-step {
  position: absolute; transform: translate(-50%, -50%);
  min-width: 190px; max-width: 280px; padding: 12px 34px 12px 24px;
  background: #fff; border-radius: 10px; box-shadow: 0 10px 26px rgba(29, 63, 115, .14);
  font-family: "Questrial", "Century Gothic", "Segoe UI", sans-serif; font-size: 18px; line-height: 1.25;
  color: #163d6b; text-align: center;
}
.acs .acs-diagram .dg-step b {
  position: absolute; right: -22px; top: -20px; width: 44px; height: 44px; border-radius: 50%;
  background: #fff; box-shadow: 0 6px 16px rgba(29, 63, 115, .22);
  display: grid; place-items: center; font-size: 22px; font-weight: 700; color: #163d6b;
}
.acs .acs-diagram .dg-step.is-last {
  background: linear-gradient(100deg, #a3136c 0%, #7a3a8e 50%, #5b8fd0 100%);
  color: #fff; font-weight: 700; max-width: 320px; padding: 14px 36px 14px 24px;
}
.acs .acs-diagram .dg-step.is-last b { top: auto; bottom: -22px; }
.acs .acs-diagram .dg-box {
  position: absolute; left: 1130px; top: 420px; transform: translateY(-50%); width: 270px;
  padding: 26px 24px; background: #fff; border-radius: 26px; box-shadow: 0 16px 36px rgba(29, 63, 115, .16);
  font-family: "Questrial", "Century Gothic", "Segoe UI", sans-serif; font-size: 24px; line-height: 1.3; color: #163d6b; text-align: center;
}
.acs .acs-diagram-title {
  position: absolute; left: 0; right: 0; top: 34px; text-align: center; opacity: 0;
  font-family: "Questrial", "Century Gothic", "Segoe UI", sans-serif; color: #163d6b; font-size: 30px;
}

.acs .acs-outro {
  z-index: 95;
  background:
    radial-gradient(90% 120% at 0% 0%, rgba(0, 0, 0, .45) 0%, rgba(0, 0, 0, 0) 45%),
    linear-gradient(115deg, #10284a 0%, #1d4f82 38%, #5b2f7a 70%, #a3136c 100%);
  color: #fff; text-align: center;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-family: "Questrial", "Century Gothic", "Segoe UI", sans-serif;
}
.acs .acs-outro img { width: 190px; filter: drop-shadow(0 10px 30px rgba(0, 0, 0, .35)); }
.acs .acs-outro h2 { margin: 18px 0 0; font-size: 60px; font-weight: 400; }
.acs .acs-outro p { margin: 12px 0 0; font-size: 25px; opacity: .88; }
.acs .acs-outro-actions { display: flex; gap: 16px; margin-top: 44px; }
.acs .acs-outro-actions a, .acs .acs-outro-actions button {
  font-family: "Segoe UI", -apple-system, sans-serif; font-size: 20px; font-weight: 600;
  padding: 16px 30px; border-radius: 999px; cursor: pointer; text-decoration: none;
  border: 2px solid rgba(255, 255, 255, .85); background: transparent; color: #fff;
  transition: transform .15s ease, background .15s ease;
}
.acs .acs-outro-actions .is-primary { background: #fff; color: #163d6b; border-color: #fff; }
.acs .acs-outro-actions a:hover, .acs .acs-outro-actions button:hover { transform: translateY(-2px); }

/* =====================================================================
   Nep-browser + Power Apps
   ===================================================================== */
.acs .acs-stage .ic { width: 16px; height: 16px; flex: none; vertical-align: -3px; }
.acs .acs-window { position: absolute; inset: 0; display: flex; flex-direction: column; background: #fff; opacity: 0; visibility: hidden; }
.acs .acs-window.is-shown { visibility: visible; }

.acs .bw-chrome {
  height: 38px; flex: none; display: flex; align-items: center; gap: 14px;
  padding: 0 14px; background: #eef1f5; border-bottom: 1px solid #dde2e8; color: #5d6875;
}
.acs .bw-dots { display: flex; gap: 7px; }
.acs .bw-dots i { width: 11px; height: 11px; border-radius: 50%; background: #d4d9e0; display: block; }
.acs .bw-dots i:nth-child(1) { background: #f26b62; } .acs .bw-dots i:nth-child(2) { background: #f5c04f; } .acs .bw-dots i:nth-child(3) { background: #5ec26a; }
.acs .bw-nav { display: flex; gap: 12px; }
.acs .bw-nav .ic { width: 16px; height: 16px; }
.acs .bw-url {
  flex: 1; height: 26px; border-radius: 13px; background: #fff; border: 1px solid #dfe3e8;
  display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 12.5px; color: #3c4652;
  white-space: nowrap; overflow: hidden;
}
.acs .bw-url .ic { width: 13px; height: 13px; color: #6b7684; }
.acs .bw-url b { font-weight: 400; color: #8a94a1; }

.acs .pa-bar {
  height: 40px; flex: none; display: flex; align-items: center; gap: 16px;
  padding: 0 14px 0 12px; background: #742774; color: #fff;
}
.acs .pa-bar .ic { width: 18px; height: 18px; }
.acs .pa-title { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.acs .pa-title span { opacity: .75; font-weight: 400; }
.acs .pa-right { margin-left: auto; display: flex; align-items: center; gap: 18px; }
.acs .pa-share {
  height: 26px; padding: 0 10px; border-radius: 3px; background: #fff; color: #1f2328;
  display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600;
}
.acs .pa-share .ic { width: 14px; height: 14px; }
.acs .pa-avatar {
  width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid rgba(255, 255, 255, .8);
  display: grid; place-items: center; font-size: 11px; font-weight: 600;
}

.acs .app { flex: 1; display: flex; min-height: 0; position: relative; }
.acs .sb {
  width: 208px; flex: none; position: relative; display: flex; flex-direction: column;
  color: #fff; padding: 16px 10px 12px;
  background:
    radial-gradient(140% 60% at 100% 100%, rgba(170, 20, 110, .95) 0%, rgba(170, 20, 110, 0) 70%),
    radial-gradient(120% 50% at 0% 55%, rgba(40, 110, 170, .55) 0%, rgba(40, 110, 170, 0) 70%),
    linear-gradient(180deg, #0c1a2c 0%, #12304f 32%, #1d4a78 58%, #3a3a7a 80%, #8b1b6f 100%);
}
.acs .sb-logo { display: flex; align-items: center; gap: 8px; padding: 2px 6px 18px; }
.acs .sb-logo img { width: 44px; height: auto; }
.acs .sb-logo strong { display: block; font-size: 19px; letter-spacing: .6px; font-weight: 600; line-height: 1; font-family: "Questrial", "Century Gothic", "Segoe UI", sans-serif; }
.acs .sb-logo small { display: block; font-size: 6.6px; letter-spacing: 1.1px; opacity: .85; margin-top: 3px; }
.acs .sb-nav { display: flex; flex-direction: column; gap: 2px; }
.acs .sb-item {
  display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px;
  border-radius: 4px; font-size: 13px; color: rgba(255, 255, 255, .92); cursor: pointer;
}
.acs .sb-item .ic { width: 15px; height: 15px; opacity: .8; }
.acs .sb-item:hover { background: rgba(255, 255, 255, .08); }
.acs .sb-item.is-active { background: rgba(255, 255, 255, .16); font-weight: 600; color: #fff; }
.acs .sb-sep { height: 1px; background: rgba(255, 255, 255, .16); margin: 10px 8px; }
.acs .sb-user {
  margin-top: auto; display: flex; gap: 10px; align-items: flex-start;
  padding: 12px 8px 0; border-top: 1px solid rgba(255, 255, 255, .16); font-size: 12px;
}
.acs .sb-user .ic { width: 24px; height: 24px; flex: none; opacity: .9; }
.acs .sb-user strong { display: block; font-size: 12.5px; }
.acs .sb-user span { display: block; opacity: .8; font-size: 11px; }

.acs .main { flex: 1; min-width: 0; overflow: hidden auto; background: #e9ebef; position: relative; scrollbar-width: thin; }
.acs .main::-webkit-scrollbar { width: 8px; }
.acs .main::-webkit-scrollbar-thumb { background: #b9bfc8; border-radius: 4px; }
.acs .pg { padding: 20px 26px 150px; min-height: 100%; }
.acs .pg-in { animation: acs-pg-in .35s ease both; }
@keyframes acs-pg-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.acs .pg-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.acs .pg-title { margin: 0; font-size: 26px; font-weight: 600; color: #1b1f24; letter-spacing: -.2px; }
.acs .pg-sub { margin: 4px 0 0; color: #5d6670; font-size: 13px; }
.acs .sec { margin: 20px 0 8px; font-size: 14px; font-weight: 600; color: #252a31; }
.acs .row { display: flex; align-items: center; gap: 10px; }
.acs .mt { margin-top: 16px; }
.acs .muted { color: #6b7380; }

.acs .btn {
  height: 32px; padding: 0 14px; border-radius: 3px; border: 1px solid #c9ced6; background: #fff;
  color: #1f2328; font: inherit; font-size: 13px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap;
  transition: background .12s ease, transform .1s ease, box-shadow .12s ease;
}
.acs .btn .ic { width: 15px; height: 15px; }
.acs .btn:hover { background: #f5f6f8; }
.acs .btn-primary { background: #0f6a9a; border-color: #0f6a9a; color: #fff; }
.acs .btn-primary:hover { background: #0c5b85; }
.acs .btn.is-disabled, .acs .btn[disabled] { background: #f0f1f3; border-color: #e3e5e8; color: #a3a9b2; cursor: default; }
.acs .btn.is-pressed { transform: scale(.97); }

.acs .card { background: #fff; border-radius: 4px; box-shadow: 0 1px 2px rgba(0, 0, 0, .08), 0 0 0 1px rgba(0, 0, 0, .03); }
.acs .card-pad { padding: 16px 18px; }
.acs .card-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 6px; font-weight: 600; font-size: 14px; }
.acs .link { display: inline-flex; align-items: center; gap: 6px; color: #1f2328; font-weight: 600; font-size: 13px; cursor: pointer; }
.acs .link .ic { width: 16px; height: 16px; }

.acs .stats4, .acs .stats5 { display: grid; gap: 14px; }
.acs .stats4 { grid-template-columns: repeat(4, 1fr); }
.acs .stats5 { grid-template-columns: repeat(5, 1fr); }
.acs .stat { background: #fff; border-radius: 4px; padding: 14px 16px 14px; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); transition: box-shadow .15s ease, transform .15s ease; }
.acs .stat b { display: block; font-size: 22px; font-weight: 700; color: #1b1f24; line-height: 1.1; }
.acs .stat span { display: block; margin-top: 6px; font-size: 12px; color: #4b535e; }
.acs .stat.is-blue b { color: #0f6a9a; }

.acs .src .ic { width: 11px; height: 11px; }

.acs .vio { margin: 0 16px 12px; display: flex; gap: 10px; padding: 10px 14px; border-radius: 4px; background: #fff8e6; border: 1px solid #f1d38a; color: #5c4200; font-size: 12.5px; animation: acs-fade .25s ease both; }

.acs .sug-card { width: 560px; }

.acs .sug-h { margin: 0 0 8px; font-size: 14px; font-weight: 600; }

.acs .sug-tbl .inp { height: 28px; font-size: 12px; padding: 0 8px; }

.acs .infobar { display: flex; align-items: center; gap: 8px; margin: 22px 0 10px; padding: 9px 12px; background: #fff; border-radius: 4px; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); font-size: 12.5px; max-width: 560px; }

/* contract */

.acs .paper.ct h5 { margin: 16px 0 4px; font-size: 12px; }

/* TechSupply-factuur */
.acs .paper.ts { padding: 0 0 30px; }
.acs .ts-head { background: #13294b; color: #fff; display: flex; justify-content: space-between; align-items: center; padding: 26px 36px; }
.acs .ts-head strong { display: block; font-size: 17px; }
.acs .ts-head small { display: block; opacity: .7; font-size: 10px; margin-top: 4px; }
.acs .ts-head b { color: #f28c38; font-size: 26px; letter-spacing: 1px; }

.acs .ts-tot .big { background: #f28c38; color: #fff; font-weight: 700; font-size: 13px; }
.acs .ts-note { margin: 22px 36px 0; background: #f5f6f8; padding: 12px 14px; font-size: 10.5px; }

/* opdrachtenlijst onder de speler */
.acs .acs-tasks { display: none; margin-top: 14px; border: 1px solid var(--acs-border); border-radius: 14px; background: var(--acs-surface); padding: 14px 16px 12px; color: var(--acs-ink); }

.acs .acs-tasks-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.acs .acs-tasks-head strong { font-size: 15px; }
.acs .acs-tasks-count { font-size: 12.5px; color: var(--acs-muted); }
.acs .acs-task-list { list-style: none; margin: 10px 0 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 2px 22px; }
.acs .acs-task-list li { display: flex; align-items: center; gap: 10px; min-height: 36px; font-size: 13.5px; }
.acs .acs-task-check { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--acs-border); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--acs-muted); flex: none; }
.acs .acs-task-check .ic { width: 13px; height: 13px; stroke-width: 2.4; }
.acs .acs-task-list li.is-done .acs-task-check { background: #107c41; border-color: #107c41; color: #fff; }
.acs .acs-task-list li.is-done .acs-task-t { color: var(--acs-muted); text-decoration: line-through; }
.acs .acs-task-list li.is-just .acs-task-check { animation: acs-pop .45s cubic-bezier(.2, 1.6, .4, 1) both; }
.acs .acs-task-list button { margin-left: auto; border: 1px solid var(--acs-border); background: none; color: var(--acs-ink); border-radius: 999px; padding: 3px 11px; font: inherit; font-size: 12px; cursor: pointer; white-space: nowrap; }
.acs .acs-task-list button:hover { border-color: var(--acs-muted); }
.acs .acs-tasks-done { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--acs-border); font-size: 13.5px; }
.acs .acs-tasks-done:empty { display: none; }
.acs .acs-tasks-done .ic { width: 20px; height: 20px; color: #107c41; }
.acs .acs-tasks-done a { margin-left: auto; padding: 7px 16px; border-radius: 999px; background: var(--acs-grad); color: #fff; font-weight: 600; text-decoration: none; }
.acs.is-compact .acs-task-list { grid-template-columns: 1fr; }
.acs .ts-lines td.r { white-space: nowrap; }
.acs:not(.is-try) .modal { max-height: calc(100% - 118px); }

.acs .acs-tasks-tip { display: none; margin: 6px 0 0; font-size: 12.5px; color: var(--acs-muted); }
.acs.is-narrow .acs-tasks-tip { display: block; }

    :root {
      --page-bg: #f4f6f9;

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --page-bg: #0b111a; --page-ink: #e8edf4; --page-muted: #9aa6b8; color-scheme: dark; }
    }
    :root[data-theme="dark"] { --page-bg: #0b111a; --page-ink: #e8edf4; --page-muted: #9aa6b8; color-scheme: dark; }

    html, body { margin: 0; }

    /* ingesloten in een iframe: alleen de speler, transparante achtergrond */
    html.is-embed, html.is-embed[data-theme] { color-scheme: normal; }
    html.is-embed body { background: transparent; }
    html.is-embed .wrap { max-width: none; padding: 0 0 4px; }
    html.is-embed .intro { display: none; }
  </style>

        else if (ex.operator && ex.waarde != null && !cmp(n, ex.operator, ex.waarde, tol)) why = 'voldoet niet aan ' + ex.operator + ' ' + fmtN(ex.waarde);
      } else if (rule.type === 'Confidence-drempel') {
        var w = ex.waarde != null ? ex.waarde : 0.9;
        if (t.c == null) why = 'heeft geen confidence-score';
        else if (!cmp(t.c / 100, ex.operator || '>=', w)) why = 'heeft een confidence van ' + t.c + '% (minimaal ' + Math.round(w * 100) + '%)';
      } else if (rule.type === 'Formaat') {
        try { if (ex.pattern && !new RegExp(ex.pattern).test(v)) why = 'heeft niet het verwachte formaat'; } catch (e) { return null; }
      } else if (rule.type === 'Kruisveld') {
        var other = ex.vergelijkVeld ? getF(ex.vergelijkVeld) : null;
        var ref = other ? other.v : ex.waarde;
        if (ref == null) continue;
        var n2 = parseNum(ref);
        var ok = !isNaN(n) && !isNaN(n2) ? cmp(n, ex.operator || '==', n2, tol) : (ex.operator === '!=' ? v !== String(ref).trim() : v === String(ref).trim());
        if (!ok) why = 'komt niet overeen met ' + (other ? other.k : String(ref));
      }
      if (why) return t.label + (v && rule.type !== 'Verplicht' ? ' (' + v + ')' : '') + ' ' + why;
    }
    return null;
  }

  Demo.prototype.onAction = function (action, el) {
    var S = this.S, cfg = this.cfgOf(), idx = +el.getAttribute('data-idx'), M = S.modal;
    switch (action) {
      case 'nav': this.go(el.getAttribute('data-page')); break;
      case 'dd-toggle': {
        var dd = el.closest('.dd');
        if (dd.classList.contains('is-disabled')) return;
        var key = dd.getAttribute('data-dd');
        S.openDD = S.openDD === key ? null : key;
        this.$$('.dd').forEach(function (x) { x.classList.toggle('open', x.getAttribute('data-dd') === S.openDD); });
        break;
      }
      case 'dd-pick': this.pick(el.closest('.dd').getAttribute('data-dd'), el.getAttribute('data-value')); break;
      case 'toggle': {
        var k = el.getAttribute('data-key');
        if (k === 'showInactive') S.showInactive = !S.showInactive;
        else cfg[k] = !cfg[k];
        this.render({ keep: true });
        break;
      }
      case 'tab': S.dtTab = el.getAttribute('data-tab'); S.openDD = null; this.render({}); break;
      case 'dash-tab': S.dashTab = el.getAttribute('data-dash'); this.render({}); break;
      case 'open-dt':
        S.dtName = el.getAttribute('data-name'); S.dtTab = el.getAttribute('data-tab') || 'algemeen'; S.tblSel = 0;
        this.go('doctype');
        break;
      case 'new-dt': this.newDoctype(); break;
      case 'dt-back': {
        if (cfg && cfg.isNew && !cfg.fields.length && !cfg.tables.length && /^Nieuw documenttype/.test(S.dtName)) {
          delete S.dtc[S.dtName];
          if (S.lastCustom === S.dtName) S.lastCustom = null;
          S.dtName = 'Facturen';
        }
        this.go('doctypes');
        break;
      }
      case 'demo-only': this.toast('Alleen in de volledige versie', 'Deze functie is in de demo niet beschikbaar.', 'info'); break;
      case 'save-dt': {
        if (cfg.isNew) cfg.isNew = false; else cfg.version += 1;
        this.toast('Documenttype opgeslagen', S.dtName + ' is opgeslagen (versie ' + cfg.version + ').');
        break;
      }
      case 'open-doc': this.openDoc(el.getAttribute('data-id')); break;
      case 'validate-doc': this.finishDoc('done'); break;
      case 'reject-doc': this.finishDoc('rejected'); break;
      case 'tbl-toggle': S.tblWide = !S.tblWide; this.render({ keep: true }); break;
      case 'pick-file': {
        if (el.getAttribute('data-for') === 'sug') { var G = this.sugState(); G.samplesOpen = !G.samplesOpen; }
        else if (!S.upload.busy) S.samplesOpen = !S.samplesOpen;
        this.render({ keep: true });
        break;
      }
      case 'sample': {
        var smp = SAMPLES[el.getAttribute('data-key')];
        if (el.getAttribute('data-for') === 'sug') { var G2 = this.sugState(); G2.file = smp.key; G2.samplesOpen = false; }
        else { S.upload.file = smp; if (!S.upload.type) S.upload.type = smp.type; S.samplesOpen = false; }
        this.render({ keep: true });
        break;
      }
      case 'do-upload': this.upload().catch(swallow); break;
      case 'export-csv': this.exportCsv(); break;

      /* AI-suggesties */
      case 'sug-analyze': this.analyze(); break;
      case 'sug-cancel': S.sug = null; this.render({ keep: true }); break;
      case 'sug-check': case 'sug-req': case 'sug-ccheck': case 'sug-creq': case 'sug-tcheck': {
        var Gs = this.sugState(), i = +el.getAttribute('data-i');
        if (action === 'sug-check') Gs.fields[i].on = !Gs.fields[i].on;
        if (action === 'sug-req') { Gs.fields[i].req = !Gs.fields[i].req; if (Gs.fields[i].req) Gs.fields[i].on = true; }
        if (action === 'sug-tcheck') Gs.table.on = !Gs.table.on;
        if (action === 'sug-ccheck') { Gs.table.cols[i].on = !Gs.table.cols[i].on; if (Gs.table.cols[i].on) Gs.table.on = true; }
        if (action === 'sug-creq') Gs.table.cols[i].req = !Gs.table.cols[i].req;
        this.render({ keep: true });
        break;
      }
      case 'sug-add': this.applySuggestions(); break;

      /* velden, tabellen, kolommen, stappen, regels */
      case 'field-new': this.openModal({ kind: 'field', isNew: true, idx: cfg.fields.length, name: '', ai: '', dtype: 'Tekst', req: false }); break;
      case 'field-edit': { var f = cfg.fields[idx]; this.openModal({ kind: 'field', idx: idx, name: f.name, ai: f.ai, dtype: f.type, req: f.req, aiTouched: true }); break; }
      case 'field-del': { var fd = cfg.fields.splice(idx, 1)[0]; this.render({ keep: true }); this.toast('Veld verwijderd', fd.name + ' wordt niet meer uitgelezen.', 'info'); break; }
      case 'table-sel': S.tblSel = idx; this.render({ keep: true }); break;
      case 'table-new': this.openModal({ kind: 'table', isNew: true, name: '' }); break;

  Demo.prototype.saveModal = function () {
    var S = this.S, M = S.modal, cfg = this.cfgOf(), name = String(M.name || '').trim();

    } else if (M.kind === 'field' || M.kind === 'col') {
      var list = M.kind === 'col' ? cfg.tables[S.tblSel].cols : cfg.fields;
      var obj = { name: name, ai: String(M.ai || '').trim() || name, type: M.dtype, req: !!M.req, fresh: true };
      if (M.isNew) list.push(obj); else list[M.idx] = obj;

  /* ---------- AI-suggesties uitvoeren ---------- */
  Demo.prototype.analyze = function () {
    var S = this.S, G = this.sugState(), self = this;

    G.stage = 'analyzing';
    G.samplesOpen = false;
    this.render({ keep: true });
    this.addCost({ n: 0, di: COST_DI, gpt: 0 });
    this.appCtx().wait(2600).then(function () {
      if (S.sug !== G || G.stage !== 'analyzing') return;
      var src = SAMPLES[G.file].src();
      G.fields = src.suggest.fields.map(function (n) { return { on: false, name: n, ai: aiName(n), type: guessType(n), req: false }; });
      G.table = { on: false, name: 'Tabel 1', cols: src.suggest.cols.map(function (n) { return { on: false, name: n, ai: aiName(n), type: guessType(n), req: false }; }) };
      G.stage = 'review';
      if (S.page === 'doctype' && S.dtTab === 'suggest') self.render({ keep: false });
    }).catch(swallow);
  };
  Demo.prototype.applySuggestions = function () {
    var S = this.S, G = this.sugState(), cfg = this.cfgOf();
    var have = {};
    cfg.fields.forEach(function (f) { have[norm(f.name)] = true; });
    var nf = 0;
    G.fields.forEach(function (f) {
      if (!f.on || have[norm(f.name)]) return;
      cfg.fields.push({ name: f.name.trim() || f.ai, ai: f.ai.trim() || aiName(f.name), type: f.type, req: f.req, fresh: true });
      nf++;
    });
    var nt = 0;
    if (G.table && G.table.on) {
      var cols = G.table.cols.filter(function (c) { return c.on; }).map(function (c) { return { name: c.name.trim() || c.ai, ai: c.ai.trim() || aiName(c.name), type: c.type, req: c.req }; });
      if (cols.length) { cfg.tables.push({ name: G.table.name.trim() || 'Tabel ' + (cfg.tables.length + 1), cols: cols }); nt = 1; }
    }
    if (!nf && !nt) return;
    S.sug = null;
    S.dtTab = 'velden';
    this.render({});
    this.toast('Suggesties overgenomen', nf + ' veld' + (nf === 1 ? '' : 'en') + (nt ? ' en 1 tabel' : '') + ' toegevoegd aan ' + S.dtName + '.');

  Demo.prototype.autoVerdict = function (doc, cfg) {
    if (!cfg || !cfg.autoValidate) return { ok: false };
    var forced = this.evalRules(doc).filter(function (v) { return v.force; });
    if (forced.length) return { ok: false, forced: forced[0] };
    var req = doc.fields.filter(function (f) { return f.req; }), set = req.length ? req : doc.fields;
    if (!set.length) return { ok: false };
    if (cfg.criterion === 'Verplichte velden') return { ok: set.every(function (f) { return String(f.v).trim(); }) };
    var th = parseNum(cfg.threshold);
    if (isNaN(th)) th = 0.9;
    return { ok: doc.conf != null && set.every(function (f) { return f.c != null && f.c / 100 >= th; }) };
  };
  Demo.prototype.addCost = function (x) {
    var today = this.S.costs[this.S.costs.length - 1];
    today.n += x.n; today.di += x.di; today.gpt += x.gpt;
  };

  Demo.prototype.process = function (doc) {
    var self = this, ctx = this.appCtx(), S = this.S;
    var cfg0 = S.dtc[doc.type], steps = cfg0 ? cfg0.steps : [{ name: 'Verwerken' }];
    doc.status = 'processing';
    doc.step = 0;
    this.refresh();
    var chain = ctx.wait(1100);
    steps.forEach(function (s, i) {
      chain = chain.then(function () { doc.step = i + 1; self.refresh(); return ctx.wait(i === 0 ? 2000 : 2300); });
    });
    return chain.then(function () {
      var cfg = S.dtc[doc.type];
      if (doc.src && cfg) {
        var x = extract(doc.src, cfg);
        doc.fields = x.fields; doc.tables = x.tables; doc.target = x.conf; doc.noConf = x.conf == null;
      }
      doc.conf = doc.target;
      if (cfg) {
        var di = cfg.steps.some(function (s) { return /^(prebuilt|mistral)/i.test(s.model); }), gpt = cfg.steps.some(function (s) { return !/^(prebuilt|mistral)/i.test(s.model); });
        self.addCost({ n: 1, di: di ? COST_DI : 0, gpt: gpt ? COST_GPT : 0 });
      }
      var verdict = self.autoVerdict(doc, cfg);
      if (verdict.ok) {
        doc.status = 'done'; doc.validation = 'Automatisch'; doc.doneAt = new Date();
        self.toast('Automatisch gevalideerd', doc.name + ' voldeed aan de criteria en is direct weggeschreven.');
      } else {
        doc.status = 'validate';
        if (verdict.forced) self.toast('Handmatige controle afgedwongen', 'Validatieregel "' + verdict.forced.rule.name + '": ' + verdict.forced.msg + '.', 'warn');
      }
      doc.fresh = true;
      self.refresh();
      self.goal('upload');
      if (cfg && cfg.custom) self.goal('own');
    });
  };

  /* =====================================================================

  function Pilot(demo, ctx) { this.d = demo; this.ctx = ctx; this.bendSign = 1; }
  Pilot.prototype.wait = function (ms) { return this.ctx.wait(ms); };
  Pilot.prototype.tween = function (ms, fn, e) { return this.ctx.tween(ms, fn, e); };
  Pilot.prototype.q = function (sel) { return typeof sel === 'string' ? this.d.stage.querySelector(sel) : sel; };
  Pilot.prototype.until = function (fn, ms) {
    var self = this, t0 = this.d.clock.t;
    var loop = function () {
      if (fn() || self.d.clock.t - t0 > (ms || 9000)) return Promise.resolve();
      return self.wait(120).then(loop);

    return loop();
  };
  /* Ondertitel tonen; wacht eerst tot de vorige lang genoeg in beeld was */
  Pilot.prototype.caption = function (text) {
    var d = this.d, self = this;

    return (need > 0 && d.capText ? this.wait(need) : Promise.resolve()).then(function () {
      if (!self.ctx.alive()) throw CANCEL;
      d.setCaption(text);
    });
  };
  Pilot.prototype.point = function (el, fx, fy) {
    var r = el.getBoundingClientRect(), s = this.d.stage.getBoundingClientRect(), k = this.d.scale;
    return { x: (r.left - s.left + r.width * fx) / k, y: (r.top - s.top + r.height * fy) / k };
  };
  Pilot.prototype.scroller = function (el) { return el.closest('.modal-body') || el.closest('.main'); };
  Pilot.prototype.scrollTo = function (box, to, ms) {
    var from = box.scrollTop;
    to = clamp(to, 0, box.scrollHeight - box.clientHeight);
    if (Math.abs(to - from) < 2) return Promise.resolve();
    return this.tween(ms || Math.min(1300, 450 + Math.abs(to - from) * .8), function (p) { box.scrollTop = from + (to - from) * p; });
  };
  Pilot.prototype.scrollMain = function (target, offset) {
    var main = this.d.main;
    if (typeof target === 'number') return this.scrollTo(main, target);

  };
  Pilot.prototype.scrollInto = function (box, el, offset) {
    if (!box || !el) return Promise.resolve();
    var delta = (el.getBoundingClientRect().top - box.getBoundingClientRect().top) / this.d.scale - (offset || 16);
    return this.scrollTo(box, box.scrollTop + delta);
  };
  Pilot.prototype.ensureVisible = function (el) {
    var box = this.scroller(el);
    if (!box) return Promise.resolve();
    var k = this.d.scale, r = el.getBoundingClientRect(), b = box.getBoundingClientRect();
    var margin = 70 * k, delta = 0;
    var cap = this.d.caption;
    var bottomPad = margin + (cap.classList.contains('is-on') && !this.d.root.classList.contains('is-narrow') && box.classList.contains('main') ? cap.offsetHeight : 0);
    if (r.top < b.top + margin * .5) delta = r.top - (b.top + margin);
    else if (r.bottom > b.bottom - bottomPad) delta = Math.min(r.bottom - (b.bottom - bottomPad), r.top - (b.top + margin));
    if (Math.abs(delta) < 2) return Promise.resolve();

  Pilot.prototype.moveXY = function (x, y, dur) {
    var d = this.d, c = d.cursor, x0 = c.x, y0 = c.y;

    if (dist < 2) return Promise.resolve();
    var nx = -dy / dist, ny = dx / dist, bend = .1 * dist * (this.bendSign = -this.bendSign);

    return this.tween(dur || Math.min(1150, 420 + dist * .55), function (p) {
      var q = 1 - p;
      c.x = q * q * x0 + 2 * q * p * cx + p * p * x;

    o = o || {};

  };
  Pilot.prototype.hover = function (target, ms, o) {

  };
  Pilot.prototype.click = function (target, o) {

  Pilot.prototype.type = function (target, text, o) {
    o = o || {};

  function chConfig(P, d) {

  function chDash(P, d) {
    return P.click('.sb-item[data-page="dashboard"]')
      .then(function () { return P.caption('Opvallend veel specifieke documentstromen? Krijg inzicht in het dashboard.'); })

      .then(function () { return P.hover('tr[data-res="0"]', 900, { fx: .2 }); })

  }

  function chEnd(P, d) {
    var need = d.capAt + readTime(d.capText) - d.clock.t;
    return P.wait(Math.max(0, need)).then(function () {
      d.setCaption(null);
      d.showCursor(false);
      var out = d.scene('outro', true, 0);
      return P.tween(900, function (p) { out.style.opacity = p; });
    });
  }

  /* Bestand van "het bureaublad" naar de dropzone slepen */
  Demo.prototype.dragFile = function (P, sample) {
    var d = this, df = this.$('.acs-dragfile');
    df.querySelector('.acs-df-name').textContent = sample.name;
    var place = function () { df.style.transform = 'translate(' + (d.cursor.x - 18) + 'px,' + (d.cursor.y - 16) + 'px) rotate(-3deg)'; };
    var drop;
    return P.moveXY(1360, 770, 900).then(function () {
      d.cursorEl.classList.remove('is-hand');
      place();
      return P.tween(250, function (p) { df.style.opacity = p; });
    }).then(function () {
      drop = P.q('.drop');
      var tgt = P.point(drop, .45, .5);
      var anim = P.moveXY(tgt.x, tgt.y, 1400);
      var follow = function () { place(); };
      d.clock.anims.add(follow);
      return anim.then(function () { d.clock.anims.delete(follow); place(); }, function (e) { d.clock.anims.delete(follow); throw e; });
    }).then(function () {
      drop.classList.add('is-over');
      return P.wait(450);
    }).then(function () {
      return P.tween(200, function (p) { df.style.opacity = 1 - p; });
    }).then(function () {
      d.S.upload.file = sample;
      d.render({ keep: true });
    });
  };

  /* =====================================================================
     Speler: afspelen, pauzeren, hoofdstukken, zelf proberen
     ===================================================================== */
  Demo.prototype.setCaption = function (text) {
    var cap = this.caption, span = this.captionText;
    this.capText = text;
    this.capAt = this.clock.t;
    if (!text) { cap.classList.remove('is-on'); return; }
    if (!cap.classList.contains('is-on')) {
      span.textContent = text;
      cap.classList.add('is-on');
      return;
    }
    span.classList.add('is-swap');
    setTimeout(function () { span.textContent = text; span.classList.remove('is-swap'); }, 220);
  };

  Demo.prototype.run = function (k) {
    var self = this;
    this.token++;
    var tok = this.token;
    var ctx = new Ctx(this.clock, function () { return tok === self.token; });
    var P = new Pilot(this, ctx);
    var step = function (i) {
      if (tok !== self.token) return;
      if (i >= CHAPTERS.length) { self.ended(); return; }
      self.chIndex = i;
      self.chStart = self.clock.t;
      self.updateChapters();
      return CHAPTERS[i].run(P, self).then(function () { return step(i + 1); });
    };
    Promise.resolve().then(function () { return step(k); }).catch(swallow);
  };

  Demo.prototype.poster = function () {
    this.resetScenes(0);
    var logo = this.$('.acs-intro-logo'), title = this.$('.acs-intro-title');
    logo.style.opacity = 1;
    logo.style.transform = 'translate(-50%, calc(-50% - 120px)) scale(.76)';
    title.style.opacity = 1;
    this.posterShown = true;
  };

  Demo.prototype.jump = function (k) {
    k = clamp(k | 0, 0, CHAPTERS.length - 1);
    var fromPoster = this.posterShown && k === 0;
    this.posterShown = false;
    this.token++;
    this.appEpoch++;
    this.mode = 'auto';
    this.root.classList.remove('is-try', 'is-ended');
    this.$('.toasts').innerHTML = '';
    this.S = seed(this.o);
    this.goals = {};
    this.updateTasks();
    this.setCaption(null);
    this.resetScenes(k);
    if (k > 0) {
      this.fastForward(k);
      this.render({ anim: false });
      this.cursor = { x: 900, y: 560 };
      this.placeCursor();
      this.showCursor(k < CHAPTERS.length - 1);
    } else {
      this.render({ anim: false });
      this.showCursor(false);
      if (fromPoster) { this.poster(); this.posterShown = false; this.introSkip = true; }
    }
    this.$('.acs-controls [data-acs="try"]').classList.remove('is-active');
    this.state = 'playing';
    this.setPlaying(true);
    this.run(k);
  };

  Demo.prototype.setPlaying = function (on) {
    this.clock.playing = on || this.mode === 'try';
    this.root.classList.toggle('is-idle', this.state === 'idle');
    this.root.classList.toggle('is-paused', !on && this.mode !== 'try');
    var b = this.$('[data-acs="toggle"]');
    var ended = this.state === 'ended';
    b.innerHTML = icon(ended ? 'replay' : on ? 'pause' : 'play');
    b.setAttribute('aria-label', ended ? 'Opnieuw afspelen' : on ? 'Pauzeren' : 'Afspelen');
    this.syncSmil();
  };
  Demo.prototype.play = function () {
    if (this.mode === 'try') { this.jump(this.chIndex); return; }
    if (this.state === 'idle' || this.state === 'ended') { this.jump(this.state === 'ended' ? 0 : this.o.chapter); return; }
    this.state = 'playing';
    this.setPlaying(true);
  };
  Demo.prototype.pause = function () {
    if (this.state !== 'playing') return;
    this.state = 'paused';
    this.setPlaying(false);
  };
  Demo.prototype.toggle = function () { this.state === 'playing' && this.mode !== 'try' ? this.pause() : this.play(); };
  Demo.prototype.ended = function () {
    this.state = 'ended';
    this.root.classList.add('is-ended');
    this.chIndex = CHAPTERS.length - 1;
    this.updateChapters(true);
    this.setPlaying(false);
    this.clock.playing = true;
  };

  Demo.prototype.enterTry = function () {
    this.token++;
    this.mode = 'try';
    this.state = 'paused';
    this.root.classList.add('is-try');
    this.root.classList.remove('is-ended', 'is-paused');
    this.setCaption(null);
    this.showCursor(false);
    var win = this.$('.acs-window');
    if (!win.classList.contains('is-shown') || this.$('.acs-outro').classList.contains('is-shown') || this.$('.acs-intro').classList.contains('is-shown') || this.$('.acs-diagram').classList.contains('is-shown')) {
      this.resetScenes(1);
      win.style.transform = '';
      if (this.chIndex === 0) this.chIndex = 1;
      this.go('start');
    }
    this.S.openDD = null;
    this.setPlaying(false);
    this.clock.playing = true;
    this.$('.acs-controls [data-acs="try"]').classList.add('is-active');
    this.updateChapters();
    this.updateTasks();
  };

  /* ---------- opdrachten in "zelf proberen" ---------- */
  var GOALS = [
    ['upload', 'Upload een document en kijk hoe de AI het uitleest'],
    ['validate', 'Controleer een document en valideer het'],
    ['newtype', 'Maak een nieuw documenttype aan'],
    ['suggest', 'Laat de AI velden voorstellen met AI-suggesties'],
    ['own', 'Upload een document van je eigen documenttype'],
    ['rule', 'Richt een validatieregel in'],
    ['team', 'Geef een collega toegang via een team'],
    ['cost', 'Bekijk wat de AI-verwerking kost']
  ];
  Demo.prototype.goal = function (k) {
    if (this.mode !== 'try' || this.goals[k]) return;
    this.goals[k] = true;
    this.updateTasks(k);
  };
  Demo.prototype.updateTasks = function (justDone) {
    var list = this.$('.acs-task-list');
    if (!list) return;
    var g = this.goals, done = GOALS.filter(function (x) { return g[x[0]]; }).length;
    list.innerHTML = GOALS.map(function (x, i) {
      return '<li class="' + (g[x[0]] ? 'is-done' : '') + (x[0] === justDone ? ' is-just' : '') + '"><span class="acs-task-check">' + (g[x[0]] ? icon('check') : i + 1) + '</span><span class="acs-task-t">' + esc(x[1]) + '</span>' +
        (g[x[0]] ? '' : '<button type="button" data-acs-go="' + x[0] + '">Ga naar</button>') + '</li>';
    }).join('');
    this.$('.acs-tasks-count').textContent = done + ' van ' + GOALS.length + ' gedaan';
    this.$('.acs-tasks-done').innerHTML = done === GOALS.length ?
      icon('checkCircle') + '<span>Alles geprobeerd! Benieuwd wat ' + esc(this.o.productName) + ' voor jouw organisatie doet?</span><a href="' + esc(this.o.ctaUrl) + '" target="_top">' + esc(this.o.ctaLabel) + '</a>' : '';
  };
  Demo.prototype.goTo = function (k) {
    var S = this.S, custom = S.lastCustom && S.dtc[S.lastCustom] ? S.lastCustom : null;
    if (this.mode !== 'try') return;
    S.modal = null;
    if (k === 'upload') this.go('upload');
    else if (k === 'validate') this.go('valideren');
    else if (k === 'newtype') this.go('doctypes');
    else if (k === 'suggest') {
      if (!custom) { this.newDoctype(); this.toast('Nieuw documenttype gemaakt', 'Geef het een naam en open daarna het tabblad AI-suggesties.', 'info'); return; }
      S.dtName = custom; S.dtTab = 'suggest'; this.go('doctype');
    } else if (k === 'own') {
      if (!custom) { this.go('doctypes'); this.toast('Eerst een eigen documenttype', 'Maak een nieuw documenttype aan en laat de AI er velden bij voorstellen.', 'info'); return; }
      S.upload.type = custom; this.go('upload');
    } else if (k === 'rule' || k === 'team') {
      S.dtName = custom || 'Facturen'; S.dtTab = k === 'rule' ? 'regels' : 'team'; this.go('doctype');
    } else if (k === 'cost') { S.dashTab = 'kosten'; this.go('dashboard'); }
  };

  Demo.prototype.updateChapters = function (all) {
    var i = this.chIndex, t = this.clock.t - this.chStart;
    var self = this;
    this.$$('.acs-ch').forEach(function (el, k) {
      var fill = el.firstChild.firstChild;
      var p = all || k < i ? 1 : k > i ? 0 : clamp(t / CHAPTERS[k].est, 0, .97);
      if (self.state === 'ended') p = 1;
      fill.style.width = (p * 100).toFixed(1) + '%';
      el.classList.toggle('is-current', k === i);
    });
    var now = this.$('.acs-now');
    if (now) now.textContent = (i + 1) + '/' + CHAPTERS.length + ' · ' + CHAPTERS[i].label;
  };

  /* ---------- afmetingen / schalen ---------- */
  Demo.prototype.layout = function () {
    var root = this.root, screen = this.$('.acs-screen');
    var fs = document.fullscreenElement === root || document.webkitFullscreenElement === root;
    var w = root.clientWidth;
    if (fs) {
      var controls = this.$('.acs-controls').offsetHeight + 32;
      var capH = w < 620 ? 70 : 0;
      w = Math.min(w - 48, (window.innerHeight - controls - capH) * 16 / 9);
      screen.style.width = w + 'px';
    } else {
      screen.style.width = '';
      w = screen.clientWidth || w;
    }
    this.base = w / 1440;
    root.classList.toggle('is-narrow', w < 620);
    this.updateCam(true);
    root.classList.toggle('is-compact', root.clientWidth < 760);
    var cap = clamp(24 * this.scale * 1.05, 13, 28);
    if (w < 620) cap = 14;
    root.style.setProperty('--acs-cap-size', cap.toFixed(1) + 'px');
    if (this.o.embed && window.parent !== window) {
      try { window.parent.postMessage({ type: 'acs-demo:height', height: document.documentElement.scrollHeight }, '*'); } catch (e) { /* negeren */ }
    }
  };

  /* Op smalle schermen zoomt de "camera" in en volgt hij de cursor */
  Demo.prototype.updateCam = function (snap) {
    var c = this.cam || (this.cam = { z: 1, x: 0, y: 0 });
    var narrow = this.root.classList.contains('is-narrow');
    if (!narrow && c.z === 1 && !snap) return;
    var appOn = this.$('.acs-window').classList.contains('is-shown') && !this.$('.acs-outro').classList.contains('is-shown') && !this.$('.acs-diagram').classList.contains('is-shown');
    var follow = narrow && this.mode === 'auto' && appOn && this.cursorEl.classList.contains('is-on');
    var tz = follow ? 1.9 : 1, vw = 1440 / tz, vh = 810 / tz;
    var tx = follow ? clamp(this.cursor.x - vw / 2, 0, 1440 - vw) : 0;
    var ty = follow ? clamp(this.cursor.y - vh * .45, 0, 810 - vh) : 0;
    var f = snap ? 1 : .09;
    c.z += (tz - c.z) * f; c.x += (tx - c.x) * f; c.y += (ty - c.y) * f;
    if (Math.abs(c.z - tz) < .002 && Math.abs(c.x - tx) < .3 && Math.abs(c.y - ty) < .3) { c.z = tz; c.x = tx; c.y = ty; }
    this.scale = this.base * c.z;
    this.stage.style.transform = 'scale(' + this.scale + ') translate(' + (-c.x).toFixed(1) + 'px,' + (-c.y).toFixed(1) + 'px)';
  };

  /* ---------- events ---------- */
  Demo.prototype.bind = function () {
    var self = this, root = this.root, stage = this.stage;

    stage.addEventListener('click', function (e) {
      var a = e.target.closest('[data-action]');
      if (!e.target.closest('.dd') && self.S.openDD) {
        self.S.openDD = null;
        self.$$('.dd.open').forEach(function (x) { x.classList.remove('open'); });
      }
      if (self.S.samplesOpen && !e.target.closest('.samples, .drop')) { self.S.samplesOpen = false; self.render({ keep: true }); }
      if (!a || !stage.contains(a)) return;
      if (a.classList.contains('is-disabled') || a.disabled) return;
      self.onAction(a.getAttribute('data-action'), a, e);
    });
    stage.addEventListener('input', function (e) { self.onInput(e.target); });

    this.$('.acs-shield').addEventListener('click', function () { self.toggle(); });
    this.$('.acs-bigplay').addEventListener('click', function () { self.play(); });

    root.addEventListener('click', function (e) {
      var b = e.target.closest('[data-acs]');
      if (b) {
        var what = b.getAttribute('data-acs');
        if (what === 'toggle') self.toggle();
        else if (what === 'restart') self.jump(0);
        else if (what === 'try') { if (self.mode === 'try') self.jump(self.chIndex); else self.enterTry(); }
        else if (what === 'resume') self.jump(self.chIndex);
        else if (what === 'fullscreen') self.fullscreen();
        return;
      }
      var go = e.target.closest('[data-acs-go]');
      if (go) { self.goTo(go.getAttribute('data-acs-go')); return; }
      var ch = e.target.closest('.acs-ch');
      if (ch) self.jump(+ch.getAttribute('data-ch'));
    });

    root.addEventListener('keydown', function (e) {
      if (e.target.closest('input, textarea')) return;
      if (e.key === ' ' || e.key === 'k') {
        if (e.target.closest('button, a') && e.key === ' ') return;
        e.preventDefault(); self.toggle();
      } else if (e.key === 'ArrowRight' && !e.target.closest('.acs-stage')) self.jump(self.chIndex + 1);
      else if (e.key === 'ArrowLeft' && !e.target.closest('.acs-stage')) self.jump(self.chIndex - 1);
    });

    if (window.ResizeObserver) new ResizeObserver(function () { self.layout(); }).observe(root);
    window.addEventListener('resize', function () { self.layout(); });
    document.addEventListener('fullscreenchange', function () { self.layout(); });

    this.clock.anims.add(function () {
      if (self.state !== 'idle' && self.mode === 'auto') self.updateChapters();
      self.updateCam(false);
    });

    // automatisch starten zodra de demo in beeld komt, pauzeren als hij uit beeld scrolt
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.poster();
    this.updateChapters();
    this.setPlaying(false);
    if (this.o.autoplay && !reduce && 'IntersectionObserver' in window) {
      var auto = false;
      new IntersectionObserver(function (entries) {
        var vis = entries[0].isIntersecting;
        if (vis && self.state === 'idle') self.play();
        else if (!vis && self.state === 'playing') { auto = true; self.pause(); }
        else if (vis && auto && self.state === 'paused') { auto = false; self.play(); }
      }, { threshold: .35 }).observe(this.viewport);
    }
  };

  Demo.prototype.fullscreen = function () {
    var r = this.root;
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else if (r.requestFullscreen) r.requestFullscreen();
    else if (r.webkitRequestFullscreen) r.webkitRequestFullscreen();
  };

  /* =====================================================================
     Automatisch koppelen aan <div data-acs-demo>
     ===================================================================== */
  function ensureAssets() {
    if (!document.querySelector('link[href*="demo.css"]') && BASE) {
      var l = document.createElement('link');
      l.rel = 'stylesheet'; l.href = BASE + 'demo.css';
      document.head.appendChild(l);
    }
    if (!document.querySelector('link[href*="family=Questrial"]')) {
      var f = document.createElement('link');
      f.rel = 'stylesheet'; f.href = 'https://fonts.googleapis.com/css2?family=Questrial&display=swap';
      document.head.appendChild(f);
    }
  }

  function optionsFor(el) {
    var o = {}, k;
    for (k in DEFAULTS) o[k] = DEFAULTS[k];
    var ds = el.dataset;
    if (ds.ctaUrl) o.ctaUrl = ds.ctaUrl;
    if (ds.ctaLabel) o.ctaLabel = ds.ctaLabel;
    if (ds.productName) o.productName = ds.productName;
    if (ds.tagline) o.tagline = ds.tagline;
    if (ds.userName) o.userName = ds.userName;
    if (ds.userEmail) o.userEmail = ds.userEmail;
    if (ds.theme) o.theme = ds.theme;
    if (ds.autoplay) o.autoplay = ds.autoplay !== 'false' && ds.autoplay !== '0';
    if (ds.chapter) o.chapter = +ds.chapter || 0;
    if (ds.assets) o.assets = ds.assets;
    if (ds.urlParams !== undefined) {
      var q = new URLSearchParams(location.search);
      if (q.has('autoplay')) o.autoplay = q.get('autoplay') !== '0' && q.get('autoplay') !== 'false';
      if (q.has('chapter')) o.chapter = clamp(+q.get('chapter') || 0, 0, CHAPTERS.length - 1);
      if (q.has('theme')) o.theme = q.get('theme');
      if (q.has('cta')) o.ctaUrl = q.get('cta');
      if (q.has('ctaLabel')) o.ctaLabel = q.get('ctaLabel');
      if (q.has('embed')) o.embed = q.get('embed') !== '0';
      if (q.has('speed')) o.speed = clamp(+q.get('speed') || 1, .25, 8);
    }
    return o;
  }

  function mountAll() {
    ensureAssets();
    Array.prototype.forEach.call(document.querySelectorAll('[data-acs-demo]'), function (el) {
      if (el._acsDemo) return;
      el._acsDemo = new Demo(el, optionsFor(el));
    });
  }

  window.ACSDemo = { mount: function (el, opts) { var o = optionsFor(el); for (var k in opts || {}) o[k] = opts[k]; ensureAssets(); return (el._acsDemo = new Demo(el, o)); }, chapters: CHAPTERS };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mountAll);
  else mountAll();
})();

</script>
