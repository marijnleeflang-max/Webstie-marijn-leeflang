<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Slide 3 – Bronnen naar live dashboard</title>
<link rel="stylesheet" href="style.css">
<style>
  /* Lichte achtergrond, exact de kleur van de slide */
  html, body { width: 648px; height: 444px; background: #e4f0f5; color: #12305a; }
  .src {
    position: absolute; width: 58px; height: 58px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: #fff; box-shadow: 0 6px 18px rgba(20, 60, 110, .12);
  }
  .src svg { width: 24px; height: 24px; }
  .slabel { position: absolute; width: 230px; text-align: right; font-size: 22px; font-weight: 500; }
  #inlet {
    left: 600px; top: 205px; width: 28px; height: 28px; border-radius: 50%;
    background: #fff; box-shadow: 0 4px 14px rgba(20, 60, 110, .15);
    display: flex; align-items: center; justify-content: center;
  }
  #inletDot { width: 10px; height: 10px; border-radius: 50%; background: #1ea7ea; }
</style>
</head>
<body>
<svg id="lines" class="abs" width="648" height="444" style="left:0;top:0"></svg>
<div id="srcs"></div>
<div class="abs" id="inlet"><div id="inletDot"></div></div>

<script src="lib.js"></script>
<script>
const DURATION = 8;
const INLET = { x: 614, y: 219 };
const ICON = {
  phone: `<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/>`,
  check: `<rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 3h6v3H9z"/><path d="M9 13l2 2 4-4.5"/>`,
  users: `<circle cx="9" cy="8.5" r="3.2"/><path d="M3 19c.6-3.2 3-5 6-5s5.4 1.8 6 5"/><circle cx="17" cy="9.5" r="2.5"/><path d="M16.5 14c2.3.2 4 1.8 4.5 4.5"/>`,
  alert: `<path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5"/><circle cx="12" cy="17.2" r=".6" fill="currentColor"/>`,
};
const SOURCES = [
  { name: "Safety App",         color: "#1ea7ea", icon: "phone", y: 57 },
  { name: "Werkplekinspecties", color: "#12a594", icon: "check", y: 158 },
  { name: "Toolbox Meetings",   color: "#a4479c", icon: "users", y: 260 },
  { name: "Meldingen",          color: "#e2457c", icon: "alert", y: 362 },
];
const X = 297;
const svg = $("lines");
const hex2rgba = (h, a) => `rgba(${parseInt(h.slice(1, 3), 16)},${parseInt(h.slice(3, 5), 16)},${parseInt(h.slice(5, 7), 16)},${a})`;

SOURCES.forEach((s, i) => {
  // rustige S-curve van bron naar het instroompunt
  const d = `M${X + 29},${s.y} C${X + 170},${s.y} ${INLET.x - 170},${INLET.y} ${INLET.x - 14},${INLET.y}`;
  s.comet = new Comet(svg, d, { color: s.color, base: hex2rgba(s.color, 0.22), width: 1.6, tail: 110 });
  s.el = document.createElement("div"); s.el.className = "src";
  s.el.style.left = (X - 29) + "px"; s.el.style.top = (s.y - 29) + "px";
  s.el.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="${s.color}" color="${s.color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[s.icon]}</svg>`;
  $("srcs").appendChild(s.el);
  const lab = document.createElement("div"); lab.className = "slabel"; lab.textContent = s.name;
  lab.style.color = s.color; lab.style.left = (X - 29 - 18 - 230) + "px"; lab.style.top = (s.y - 15) + "px";
  $("srcs").appendChild(lab);
  s.start = 0.3 + i * 2;
});
// laatste stukje: instroompunt → dashboard
svgEl("path", { d: `M${INLET.x + 14},${INLET.y} L648,${INLET.y}`, stroke: "rgba(30,167,234,.35)", "stroke-width": 1.6 }, svg);

function renderAt(t) {
  let ping = 0, pingColor = SOURCES[0].color;
  SOURCES.forEach((s) => {
    const u = mod(t - s.start, DURATION);
    s.comet.set(prog(u, 0, 1.8));
    // bron licht even op als hij verstuurt
    const send = inHoldOut(u, 0, 0.2, 0.1, 0.7);
    s.el.style.boxShadow = `0 6px 18px rgba(20,60,110,.12), 0 0 0 ${1 + 3 * send}px ${hex2rgba(s.color, 0.15 + 0.35 * send)}`;
    const arrive = inHoldOut(u, 1.45, 0.12, 0.08, 0.7);
    if (arrive > ping) { ping = arrive; pingColor = s.color; }
  });
  $("inletDot").style.background = pingColor;
  $("inletDot").style.transform = `scale(${1 + 0.35 * ping})`;
  $("inlet").style.boxShadow = `0 4px 14px rgba(20,60,110,.15), 0 0 ${18 * ping}px ${hex2rgba(pingColor, 0.6 * ping)}`;
}
start(renderAt, DURATION);
</script>
</body>
</html>
